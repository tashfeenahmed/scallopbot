<text x="490" y="417" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="start">light every minute · deep ~72 min · nightly sleep</text>
<text x="490" y="434" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="start">dream cycle (NREM + REM), self-reflection</text>
<text x="490" y="451" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="start">gap scanner → proactive outreach</text>
