<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" role="img" aria-label="ScallopBot architecture: chat channels feed the gateway and the agent loop; the agent calls skills and the cost-aware router, which fails over between seven providers; memory and the background cognitive layer sit underneath; every reply and action goes through the outcome brain.">
