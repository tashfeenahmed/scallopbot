<text x="38" y="301" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="start">Discord · Slack · WhatsApp</text>
<text x="38" y="318" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="start">Signal · Matrix</text>
