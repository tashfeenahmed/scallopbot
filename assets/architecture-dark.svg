<text x="290" y="207" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="start">tools in parallel waves</text>
<text x="290" y="224" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="start">verify-on-stop nudge</text>
<text x="290" y="241" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="start">check-on-stop reviewer</text>
