<text x="550" y="241" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="start">34 bundled skills</text>
<text x="550" y="258" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="start">bash · files · patch</text>
<text x="550" y="275" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="start">web · browser · pdf</text>
