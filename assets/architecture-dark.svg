<text x="38" y="162" font-size="14" font-weight="700" fill="#ffffff" text-anchor="start">Web dashboard</text>
<text x="38" y="181" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="start">REST · SSE · WebSocket</text>
<rect x="24" y="200" width="190" height="48" rx="10" fill="#242423" stroke="#3d3d3a" stroke-width="1"/>
<text x="38" y="222" font-size="14" font-weight="700" fill="#ffffff" text-anchor="start">CLI</text>
<text x="38" y="241" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="start">interactive, resumable</text>
