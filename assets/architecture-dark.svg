<rect width="900" height="500" rx="14" fill="#1a1a19"/>
<text x="24" y="34" font-size="17" font-weight="700" fill="#ffffff" text-anchor="start">How ScallopBot fits together</text>
<text x="24" y="54" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="start">One Node.js process on your own server</text>
<text x="24" y="72" font-size="1" font-weight="400" fill="#c3c2b7" text-anchor="start"></text>
<rect x="24" y="80" width="190" height="48" rx="10" fill="#242423" stroke="#3d3d3a" stroke-width="1"/>
