<text x="744" y="138" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="start">Moonshot</text>
<text x="744" y="155" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="start">OpenAI</text>
<text x="744" y="172" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="start">xAI</text>
<text x="744" y="189" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="start">Groq</text>
<text x="744" y="206" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="start">Ollama</text>
<text x="744" y="223" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="start">OpenRouter</text>
<text x="744" y="240" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="start">+ any OpenAI-</text>
<text x="744" y="257" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="start">  compatible endpoint</text>
<text x="744" y="274" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="start">health-aware failover</text>
<path d="M706,130 L730,130" fill="none" stroke="#8f8e88" stroke-width="1.6" marker-end="url(#an)"/>
