<text x="290" y="329" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="start">every reply and action, one gate</text>
<rect x="536" y="80" width="170" height="100" rx="10" fill="#242423" stroke="#3d3d3a" stroke-width="1"/>
