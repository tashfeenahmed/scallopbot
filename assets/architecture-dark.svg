<text x="38" y="398" font-size="14" font-weight="700" fill="#ffffff" text-anchor="start">Memory · SQLite</text>
<text x="38" y="417" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="start">BM25 + embeddings, optional LLM re-rank</text>
<text x="38" y="434" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="start">spreading activation over typed relations</text>
<text x="38" y="451" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="start">category half-lives, fusion, utility-based forgetting</text>
