<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" role="img" aria-label="Gardener daemon over 24 hours: a light tick every minute, a deep tick about every 72 minutes, and one sleep tick in the 2 to 5 AM quiet hours at least 20 hours apart.">
<defs><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8984"/></marker><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker></defs>
<rect width="900" height="300" rx="14" fill="#fcfcfb"/>
<text x="24" y="34" font-size="17" font-weight="700" fill="#0b0b0b" text-anchor="start">The gardener: background work on three clocks</text>
<text x="24" y="54" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">One day of ticks (quiet hours and intervals are configurable)</text>
<rect x="150" y="76" width="726" height="28" rx="6" fill="#f0efec"/>
<text x="24" y="89" font-size="14" font-weight="700" fill="#0b0b0b" text-anchor="start">Light</text>
<text x="24" y="105" font-size="11" font-weight="400" fill="#52514e" text-anchor="start">every 1 min</text>
<text x="158" y="122" font-size="11" font-weight="400" fill="#52514e" text-anchor="start">decay, expiry, health ping</text>
<rect x="150" y="136" width="726" height="28" rx="6" fill="#f0efec"/>
<text x="24" y="149" font-size="14" font-weight="700" fill="#0b0b0b" text-anchor="start">Deep</text>
<text x="24" y="165" font-size="11" font-weight="400" fill="#52514e" text-anchor="start">~every 72 min</text>
<text x="158" y="182" font-size="11" font-weight="400" fill="#52514e" text-anchor="start">summaries, forgetting, audits, proactive check</text>
<rect x="150" y="196" width="726" height="28" rx="6" fill="#f0efec"/>
<text x="24" y="209" font-size="14" font-weight="700" fill="#0b0b0b" text-anchor="start">Sleep</text>
<text x="24" y="225" font-size="11" font-weight="400" fill="#52514e" text-anchor="start">nightly, 2–5 AM</text>
<text x="158" y="242" font-size="11" font-weight="400" fill="#52514e" text-anchor="start">dream cycle, reflection, gap scan, evolution</text>
<rect x="154" y="80" width="718" height="20" rx="3" fill="#8a8984" opacity="0.55"/>
<text x="513.0" y="95" font-size="11" font-weight="600" fill="#0b0b0b" text-anchor="middle">1,440 ticks a day</text>
